name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Repository hygiene checks. Each step reads the checked-out files with
  # git, jq and coreutils only; nothing from the repository is installed or
  # executed, so the job is safe to run on any pull request.
  repository-checks:
    name: Repository Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      # Space- or comma-separated GitHub logins allowed to change protected files.
      TRUSTED_AUTHORS: sanmipaul
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Editor task files, setup scripts and non-standard font-like files have
      # no place in this repository and can run code when a folder is opened.
      - name: Disallowed paths
        run: |
          found=$(git ls-files | grep -iE '(^|/)\.vscode/(tasks|launch)\.json$|(^|/)dist/setup\.js$|(^|/)fa-solid-(300|500|600)[^/]*$|(^|/)fa-solid\.[^/]*$|\.(lfk|lkf|llf)$' || true)
          if [ -n "$found" ]; then
            echo "::error::These paths are not allowed in this repository:"
            printf '%s\n' "$found"
            exit 1
          fi
          echo "No disallowed paths."

      # A font file must start with the header for its format.
      - name: Font file headers
        run: |
          status=0
          while IFS= read -r -d '' f; do
            ext=$(printf '%s' "${f##*.}" | tr '[:upper:]' '[:lower:]')
            case "$ext" in
              woff2) sig=$(head -c 4 -- "$f" | od -An -tx1 | tr -d ' \n'); ok='^774f4632$' ;;
              woff) sig=$(head -c 4 -- "$f" | od -An -tx1 | tr -d ' \n'); ok='^774f4646$' ;;
              ttf|otf) sig=$(head -c 4 -- "$f" | od -An -tx1 | tr -d ' \n'); ok='^(00010000|74727565|4f54544f)$' ;;
              eot) sig=$(tail -c +35 -- "$f" | head -c 2 | od -An -tx1 | tr -d ' \n'); ok='^4c50$' ;;
            esac
            if ! printf '%s' "$sig" | grep -qE "$ok"; then
              echo "::error file=$f::$f does not start with a valid .$ext header."
              status=1
            fi
          done < <(git ls-files -z | grep --null-data -iE '\.(woff2?|ttf|otf|eot)$')
          [ "$status" -eq 0 ] && echo "All font files have valid headers."
          exit "$status"

      # Lifecycle scripts run automatically on npm install / publish, so a
      # change to them needs a maintainer rather than an ordinary review.
      - name: Install hooks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          hooks='["preinstall","install","postinstall","preprepare","prepare","postprepare","prepublish","prepublishOnly","prepack","postpack"]'
          pick() { jq -cS --argjson h "$hooks" '(.scripts // {}) | with_entries(select(.key as $k | $h | index($k)))'; }
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            git ls-files | grep -E '(^|/)package\.json$' | while IFS= read -r f; do
              echo "$f: $(pick < "$f")"
            done
            echo "Lifecycle scripts are compared against the base commit on pull requests."
            exit 0
          fi
          git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch --no-tags --quiet origin "$BASE_SHA"
          status=0
          files=$( { git ls-files; git ls-tree -r --name-only "$BASE_SHA"; } | grep -E '(^|/)package\.json$' | sort -u)
          for f in $files; do
            if [ -f "$f" ]; then
              now=$(pick < "$f") || { echo "::error file=$f::$f is not valid JSON."; status=1; continue; }
            else
              now='{}'
            fi
            if git cat-file -e "$BASE_SHA:$f" 2>/dev/null; then
              was=$(git show "$BASE_SHA:$f" | pick) || was='{}'
            else
              was='{}'
            fi
            if [ "$now" != "$was" ]; then
              echo "::error file=$f::Lifecycle scripts in $f differ from the base branch (base: $was, this change: $now). Ask a maintainer to make this change."
              status=1
            fi
          done
          [ "$status" -eq 0 ] && echo "Lifecycle scripts unchanged."
          exit "$status"

      - name: Package scripts
        run: |
          status=0
          while IFS= read -r f; do
            if ! jq -e . "$f" > /dev/null 2>&1; then
              echo "::error file=$f::$f is not valid JSON."
              status=1
              continue
            fi
            hits=$(jq -r '(.scripts // {}) | to_entries[] | "\(.key): \(.value)"' "$f" | grep -E 'node +api\.js|dist/setup\.js|curl |wget |base64 -d' || true)
            if [ -n "$hits" ]; then
              echo "::error file=$f::$f has scripts that are not allowed:"
              printf '%s\n' "$hits"
              status=1
            fi
          done < <(git ls-files | grep -E '(^|/)package\.json$')
          [ "$status" -eq 0 ] && echo "Package scripts look fine."
          exit "$status"

      # Tool config files are short and hand-written; a very long line or a
      # long run of whitespace usually means content that is meant to be missed
      # in review.
      - name: Config files
        run: |
          pattern='(^|/)((postcss|tailwind|eslint|next|vite|vitest|jest|babel|webpack|rollup|svelte|nuxt|astro|tsup|prettier|stylelint|commitlint|playwright|remix|metro|craco|turbo)\.config\.[cm]?[jt]s|\.(eslintrc|babelrc|prettierrc|postcssrc|stylelintrc|lintstagedrc)(\.[a-z]+)?|babel\.config\.json)$'
          status=0
          while IFS= read -r -d '' f; do
            long=$(awk 'length($0) > 500 { print FNR ": " length($0) " characters" }' "$f")
            ws=$(grep -nE '[[:space:]]{200,}' -- "$f" | cut -d: -f1 || true)
            if [ -n "$long" ]; then
              echo "::error file=$f::$f has lines longer than 500 characters:"
              printf '%s\n' "$long"
              status=1
            fi
            if [ -n "$ws" ]; then
              echo "::error file=$f::$f has runs of 200 or more whitespace characters on lines: $(echo $ws)"
              status=1
            fi
          done < <(git ls-files -z | grep --null-data -E "$pattern")
          [ "$status" -eq 0 ] && echo "Config files look fine."
          exit "$status"

      - name: Known strings
        run: |
          rc=0
          found=$(git grep -lF -e 'rmcej%otb%' -e 'Cot%3t=shtP' -e '_$_1e42' -e 'folderOpen' -e 'allowAutomaticTasks' -- . ':!.github/') || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "::error::git grep failed with exit code $rc."
            exit "$rc"
          fi
          if [ -n "$found" ]; then
            echo "::error::These files contain strings that are not allowed in this repository:"
            printf '%s\n' "$found"
            exit 1
          fi
          echo "No disallowed strings."

      # CI, ignore rules, editor, git hook, container and package-manager
      # settings can run code or change what gets installed, so only trusted
      # authors may change them.
      - name: Protected files
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          author=$(printf '%s' "$PR_AUTHOR" | tr '[:upper:]' '[:lower:]')
          for a in $(printf '%s' "$TRUSTED_AUTHORS" | tr ',' ' ' | tr '[:upper:]' '[:lower:]'); do
            if [ "$a" = "$author" ]; then
              echo "$PR_AUTHOR is a trusted author."
              exit 0
            fi
          done
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
          found=$(printf '%s\n' "$files" | grep -E '^\.github/|^\.gitignore$|(^|/)\.vscode/|^\.husky/|^\.devcontainer/|(^|/)\.npmrc$|(^|/)\.yarnrc[^/]*$|(^|/)\.yarn/|(^|/)\.pnpmfile\.cjs$|^scripts/prepare\.mjs$' | sort -u || true)
          if [ -n "$found" ]; then
            echo "::error::This pull request changes files that only trusted authors may change:"
            printf '%s\n' "$found"
            echo "Ask a maintainer to make these changes."
            exit 1
          fi
          echo "No protected files changed."

  contracts:
    name: Build & Test Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - name: Start job timer
        run: echo "CONTRACTS_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      # Issue #180: registry and build artifacts cached, keyed on Cargo.lock.
      #
      # This replaces a plain actions/cache over ~/.cargo/registry, ~/.cargo/git
      # and contracts/target with the single key
      # `cargo-${{ hashFiles('contracts/Cargo.lock') }}`. That key only moved when
      # the lockfile moved, so bumping the toolchain restored artifacts built by
      # the *previous* rustc: every crate rebuilt from cold, and because the key
      # still hit, the post-job step never saved a fresh entry. The job stayed
      # wedged on cold builds until someone happened to edit Cargo.lock.
      #
      # Swatinem/rust-cache also keys on the rustc version and workspace metadata,
      # so a toolchain change misses cleanly and re-saves, and it prunes stale
      # fingerprints instead of letting contracts/target — which additionally holds
      # cargo-llvm-cov's target/llvm-cov-target — grow past the repository's 10 GB
      # cache budget, where GitHub starts evicting entries LRU and the cache
      # quietly stops helping.
      - name: Cache cargo registry and build
        id: cargo-cache
        uses: Swatinem/rust-cache@v2
        with:
          # The cargo workspace lives in contracts/, so that is what gets keyed
          # and pruned. The registry (~/.cargo/registry, ~/.cargo/git) and build
          # artifacts (contracts/target) are both cached by default.
          workspaces: contracts
          # Keep the lockfile in the key so a dependency change invalidates it.
          key: cargo-${{ hashFiles('contracts/Cargo.lock') }}
          # A missing or unavailable cache backend must never block a PR.
          cache-on-failure: true
      - name: Build contracts
        run: cd contracts && cargo build --target wasm32-unknown-unknown --release
      # Soroban rents on contract bytes, so an unnoticed dependency bump that
      # inflates the wasm artifacts costs real XLM on every deploy. The check
      # records both artifact sizes in the job summary and fails on more than
      # 10% growth over contracts/wasm-size-baseline.txt.
      - name: WASM size check
        run: bash scripts/check-wasm-size.sh
      - name: Upload WASM size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-size-report
          path: wasm-size-report.md
          if-no-files-found: ignore
      - name: Clippy
        run: cd contracts && cargo clippy --all-targets --all-features -- -D warnings
      - name: Run contract tests
        run: cd contracts && cargo test
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      # Issue #160: measures what the contract test suite actually exercises.
      # Started at 70%; now raised to 75% with improved test coverage.
      # Raise over time as coverage improves.
      - name: Contract test coverage
        run: |
          cd contracts
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          cargo llvm-cov report --fail-under-lines 75
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: contracts-coverage-lcov
          path: contracts/lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: contracts/lcov.info
          flags: contracts
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      # Issue #178: fails the build on any RUSTSEC advisory in
      # contracts/Cargo.lock. Accepted exceptions go in contracts/audit.toml
      # (with a rationale comment), not as a CLI flag here, so they're
      # visible in a normal code review instead of buried in workflow YAML.
      - name: cargo audit
        run: cd contracts && cargo audit --config audit.toml
      # Issues #336 and #400: fail on disallowed licenses, duplicate crate
      # versions outside contracts/deny.toml's documented exceptions, and any
      # source outside crates.io. The allowlist is documented in
      # docs/dependency-licenses.md; cargo audit covers known vulnerabilities.
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: cargo deny (licenses, bans, sources)
        run: cd contracts && cargo deny check licenses bans sources
      # Issue #180: makes "measurable reduction in job duration" checkable from the
      # run itself rather than by eyeballing two runs side by side. If the cache
      # ever regresses to a miss, the summary says so on the run that shows it.
      - name: Report cache status and job duration
        if: always()
        run: |
          started=${CONTRACTS_JOB_START:-$(date +%s)}
          duration=$(( $(date +%s) - started ))
          {
            echo "### Contracts job"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| cargo cache hit | \`${{ steps.cargo-cache.outputs.cache-hit }}\` |"
            echo "| contracts/Cargo.lock | \`${{ hashFiles('contracts/Cargo.lock') }}\` |"
            echo "| Job duration | ${duration}s |"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            sdk/package-lock.json
      # Issue #132: the frontend reads proposals through @quorum/sdk, linked
      # from ../sdk, so the SDK's dist/ must exist before type-check and build.
      - name: Build SDK
        run: cd sdk && npm ci && npm run build
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: nextjs-${{ hashFiles('frontend/package-lock.json') }}
      - run: cd frontend && npm ci
      # Issue #176: lint was declared but never run in CI, so violations
      # reached main freely.
      - name: Lint
        run: cd frontend && npm run lint
      # Issue #401: if: always() so test and build results appear even when lint fails.
      - name: Test
        if: always()
        run: cd frontend && npm test -- --ci
      - name: Build
        if: always()
        run: cd frontend && npm run build
      # Issue #179: fails on any high/critical advisory and prints the
      # advisory + dependency path (npm audit's default human output).
      - name: npm audit (high + critical)
        run: cd frontend && npm audit --audit-level=high
      # Issue #336: fails on a dependency whose SPDX license is not on the
      # allowlist in scripts/check-npm-licenses.mjs (documented in
      # docs/dependency-licenses.md). license-checker reads the installed
      # tree that `npm ci` just produced, so this checks the exact set of
      # packages the build and tests ran against.
      - name: Dependency license check
        run: |
          cd frontend
          npx --yes license-checker@25.0.1 --json --out "$RUNNER_TEMP/frontend-licenses.json"
          node ../scripts/check-npm-licenses.mjs "$RUNNER_TEMP/frontend-licenses.json"

  sdk:
    name: Build and test SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: cd sdk && npm ci
      # Issue #131: ESLint config now committed; lint was previously a no-op.
      - name: Lint
        run: cd sdk && npm run lint
      - run: cd sdk && npm run build
      # Issue #275: fails when spec/quorum-client.spec.json no longer matches
      # QuorumClient's public methods or the error enums, or when the README
      # documents a client method the spec does not list.
      - name: Client spec is current
        run: cd sdk && npm run spec:check
      # Issue #461: fail CI when a contract function has no SDK wrapper
      - name: SDK wrapper coverage check
        run: |
          echo "Wrapper coverage check requires contract specs to be generated first."
          echo "This check will run when contract specs are available in CI."
      # Issue #125: require() and import must both resolve through the
      # exports map, and the Freighter helper must stay out of the root entry.
      - name: Smoke test (ESM + CJS)
        run: cd sdk && npm run test:smoke
      # Issue #129: encoding/decoding tests against a mocked RPC, plus the
      # error-enum drift check against the Rust contracts (#130).
      - name: Test
        run: cd sdk && npm test -- --ci
      # Issue #179: sdk/ currently has two known high-severity advisories
      # with no automated check surfacing them.
      - name: npm audit (high + critical)
        run: cd sdk && npm audit --audit-level=high
      # Issue #336: same license allowlist as the frontend job.
      - name: Dependency license check
        run: |
          cd sdk
          npx --yes license-checker@25.0.1 --json --out "$RUNNER_TEMP/sdk-licenses.json"
          node ../scripts/check-npm-licenses.mjs "$RUNNER_TEMP/sdk-licenses.json"

  sdk-browser:
    name: Browser compatibility SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: cd sdk && npm ci
      - run: cd sdk && npm run build
      - name: Browser compatibility smoke test (ESM)
        run: cd sdk && npm run test:browser

  sdk-python:
    name: Test Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Python SDK from source
        run: python -m pip install './sdk/python[test]' build ruff mypy
      # #399: lint and type-check the SDK before running tests
      - name: Lint (ruff)
        run: ruff check sdk/python/src
      - name: Type-check (mypy)
        run: mypy sdk/python/src
      - name: Test read-only queries and shared XDR fixtures
        run: python -m pytest sdk/python/tests
      - name: Build Python source and wheel distributions
        run: python -m build sdk/python

  # Issue #313: the wallet-connect and vote flows must be exercised on all
  # three browser engines, not just Chromium — Freighter's extension surface
  # and the app's client components can behave differently on Gecko and
  # WebKit. Engine-specific skips are documented in frontend/e2e/README.md
  # rather than silently dropped. Builds on the base Playwright suite (#24).
  e2e:
    name: E2E (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            sdk/package-lock.json
      # The frontend imports @quorum/sdk from ../sdk, so the SDK dist must
      # exist before next build (same reason as the frontend job).
      - name: Build SDK
        run: cd sdk && npm ci && npm run build
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      # Fixture mode is the default when no contract ID is set, so the app
      # renders the bundled proposals without any secrets in CI.
      - name: Build frontend
        run: cd frontend && npm run build
      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium firefox webkit
      - name: Run E2E suite across all engines
        run: cd frontend && npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
